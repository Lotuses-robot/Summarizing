# 生产部署（单实例多账户，上云形态 A：阿里云轻量 2C2G + Caddy/TLS）。
# 数据 bind mount 到宿主机固定路径（备份/迁移/查看全在宿主机做，人不进容器——docs/11 阶段 2）。
#
# 两种用法：
#   本地开发/首版上线：docker compose up -d --build   （在服务器上 build，用下面的 build: .）
#   生产（CI 出镜像 → 服务器只拉）：在 .env 里设 APP_IMAGE=<ACR>/<ns>/summarizing:vX.Y.Z，
#     然后 docker compose pull && docker compose up -d  （不 build；见 docs/13）
services:
  app:
    # APP_IMAGE 由 .env 提供（生产=ACR 镜像）；缺省 summarizing:local（本地/服务器 build 的产物名）
    image: ${APP_IMAGE:-summarizing:local}
    # 有 build 段时：compose up 会构建并以此 image 名打标；生产只想 pull 就删/注释本段（或设 APP_IMAGE）
    build: .
    restart: unless-stopped
    # .env 可缺席（新机器没复制 .env.example 也起得来；老写法 env_file: .env 会硬拒启动）
    env_file:
      - path: .env
        required: false
    environment:
      # 反代（Caddy）后取真实来源 IP 供限速用；前提：本端口不直暴公网（见下 ports）。
      # 配套：XFF 由 Caddyfile 覆写为直连客户端 IP——防客户端自带伪造头（trustProxy 信任全部跳数）
      - TRUST_PROXY=1
    volumes:
      # 唯一有状态的东西：整目录 bind mount（system.db + users/<uid>.db）——宿主机可直接备份
      - ./data:/app/data
    # ⚠️ 刻意不写 ports：应用端口绝不可直暴公网（docs/11 部署注意 R12-1）；Caddy 经 compose 网络直连 app:3001
    # ⚠️ 宿主机 ./data 需可写（uid 1000，容器内 node 用户）——见 docs/11 部署注意

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # 证书与 ACME 状态（持久化，别丢）
      - caddy_config:/config
    depends_on:
      - app

  # 状态监控 + 告警（Uptime Kuma，最轻的网页面板）——**可选**（compose profile `monitor`，默认不起）：
  #   docker compose --profile monitor up -d   （服务器装了 Tailscale 后启用；见 docs/13 五）
  # **只走 Tailscale，绝不暴公网**：ports 绑 TAILSCALE_IP（服务器 tailnet 地址 100.x.y.z）而非 0.0.0.0。
  # 首次访问 http://<服务器 tailnet IP>:3002 建管理员账号，再配监测项与告警（docs/13 五）。
  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ["monitor"]
    restart: unless-stopped
    ports:
      # 绑 TAILSCALE_IP（服务器 tailnet 地址）；缺省 127.0.0.1 = 仅本机可及（也绝不暴公网）。
      # 启用时在 .env 设 TAILSCALE_IP=<tailscale ip -4> 方能从 tailnet 内其它设备访问。
      - "${TAILSCALE_IP:-127.0.0.1}:3002:3001"
    volumes:
      - uptime_kuma_data:/app/data # 监测项/账号/告警配置（持久化，别丢）
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
  uptime_kuma_data:
