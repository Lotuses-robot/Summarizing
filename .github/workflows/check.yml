name: check

# 质量门：每次 push 到 main 与每个 PR 都跑 tsc + eslint + vitest（npm run check）。
# 只做验证，不出制品——制品见 release.yml（tag 触发）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts：better-sqlite3 自带预编译二进制，禁脚本免 node-gyp 编译
      #（Linux runner 能编但慢；Windows runner 缺 VS 工具链直接失败——2026-10-12 实测）
      - run: npm ci --ignore-scripts
      - run: npm run check
