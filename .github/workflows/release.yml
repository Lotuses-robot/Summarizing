name: release

# 发布：推 v* tag 时跑质量门 → 出 Windows 便携包 → 建/更新 GitHub Release 并挂附件。
# 便携包在 windows-latest 上构建（build:release 内置的是本机 node.exe，故必须 Windows runner）。
# 镜像构建（推 ACR）随 tag 自动跑；手动触发时也可勾 build_image 单独补推/重推某个 tag。
# 前置 = 仓库已配好 4 个 ACR secret（docs/13 二·1）。服务器只 pull 镜像，不在 2C2G 上 build（docs/11 阶段 2）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_image:
        description: "同时构建并推送容器镜像到 ACR（需配好 secrets）"
        type: boolean
        default: false

permissions:
  contents: write # 建 Release / 传附件需要

jobs:
  # ── 制品 1：Windows 便携包（免安装 zip，自部署用户用）──
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts：better-sqlite3 自带预编译，禁 node-gyp 编译（Windows runner 缺 VS 工具链）
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build:release
      - uses: actions/upload-artifact@v4
        with:
          name: summarizing-portable-win-x64
          path: summarizing-portable-win-x64.zip
          if-no-files-found: error

  # ── 制品 2：容器镜像（服务器部署用）——推 v* tag 时构建并推 ACR（需配好 ACR_* secrets）──
  image:
    # 随 tag 自动构建推送；手动触发时勾 build_image 也可单独跑（用于补推/重推某 tag）。
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.build_image }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      # ⚠️ 用 docker build/push（不走 buildx）：阿里云 ACR 与 buildx(containerd) 的推送鉴权协商
      # 不兼容，报 "insufficient_scope"（2026-10-12 诊断实证：同凭据纯 docker push 成功、buildx 两种
      # 配置均失败）。buildx 专属能力（provenance/gha 缓存）放弃——本镜像构建约 1~2 分钟，可接受。
      # registry 值就地规范化：secret 若带 https:// 前缀或空白/尾斜杠，docker login 会容忍（自己剥），
      # 但拼进 TAG 会让推送目标变形（2026-10-12 实测：denied）——这里统一剥掉，防该类输入错误。
      - name: 构建并推送（docker build/push）
        run: |
          RAW="${{ secrets.ACR_REGISTRY }}"
          REG="$(printf '%s' "$RAW" | tr -d '[:space:]' | sed -E 's#^https?://##; s#/$##')"
          echo "registry 形状诊断（不含值）：raw_len=${#RAW} normalized_len=${#REG}"
          TAG="$REG/${{ secrets.ACR_NAMESPACE }}/summarizing:${{ github.ref_name }}"
          docker build -t "$TAG" .
          docker push "$TAG"

  # ── 汇总：建 Release 并把便携包挂上去（镜像 job 被跳过不影响本 job）──
  release:
    needs: [portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: summarizing-portable-win-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: summarizing-portable-win-x64.zip
          generate_release_notes: true
