name: release

# 发布：推 v* tag 时跑质量门 → 出 Windows 便携包 → 建/更新 GitHub Release 并挂附件。
# 便携包在 windows-latest 上构建（build:release 内置的是本机 node.exe，故必须 Windows runner）。
# 镜像构建（推 ACR）默认关闭——装好 Docker/配好 ACR secrets 后把 ENABLE_IMAGE_BUILD 置 true 或用
# 手动触发时勾选（见下方 image job 的 if）。服务器只 pull 镜像，不在 2C2G 上 build（docs/11 阶段 2）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_image:
        description: "同时构建并推送容器镜像到 ACR（需配好 secrets）"
        type: boolean
        default: false

permissions:
  contents: write # 建 Release / 传附件需要

jobs:
  # ── 制品 1：Windows 便携包（免安装 zip，自部署用户用）──
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts：better-sqlite3 自带预编译，禁 node-gyp 编译（Windows runner 缺 VS 工具链）
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build:release
      - uses: actions/upload-artifact@v4
        with:
          name: summarizing-portable-win-x64
          path: summarizing-portable-win-x64.zip
          if-no-files-found: error

  # ── 制品 2：容器镜像（服务器部署用）——推 v* tag 时构建并推 ACR（需配好 ACR_* secrets）──
  image:
    # 随 tag 自动构建推送；手动触发时勾 build_image 也可单独跑（用于补推/重推某 tag）。
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.build_image }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/summarizing:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 汇总：建 Release 并把便携包挂上去（镜像 job 被跳过不影响本 job）──
  release:
    needs: [portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: summarizing-portable-win-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: summarizing-portable-win-x64.zip
          generate_release_notes: true
